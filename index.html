<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Room Check</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Room Check">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/favicon-64.png">
<style>
:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --sep:#E4E4E9;
  --text:#111114;
  --sub:#8A8A8E;
  --sub2:#63656B;
  --blue:#0A63C4;
  --blue-l:#EAF1FB;
  --green:#12795A;
  --green-l:#E6F4EE;
  --red:#C42B21;
  --red-l:#FBEBEA;
  --grey:#8A8A8E;
  --grey-l:#EEEEF1;
  --amber:#96600A;
  --wall:#24262D;
  --floor:#FBFBFA;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:15px;line-height:1.35;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button{background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:#fff;border:1px solid var(--sep);
  border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
::placeholder{color:#AEB0BC}

/* header */
.hd{padding:13px 16px 0}
.pill{font-size:13.5px;font-weight:550;color:var(--blue);background:#fff;border:1px solid var(--sep);
  border-radius:9px;padding:8px 13px;flex:none}
.pill:active{background:var(--blue-l)}
.topbar{display:flex;align-items:center;gap:6px}
.ibtn{width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid var(--sep);
  display:grid;place-items:center;color:var(--blue);flex:none;font-size:17px;font-weight:600}
.ibtn:active{background:var(--blue-l)}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dtap{flex:1;min-width:0;text-align:center;padding:2px 2px}
.h1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.htitle{font-size:20px;font-weight:700;letter-spacing:-.01em}
.hsub{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
.tprow{display:block;padding:12px 14px}
.tprow input{display:block;width:100%;margin-top:8px;font-size:19px;padding:9px 10px;
  border:1px solid var(--sep);border-radius:10px;background:#fff;color:var(--text)}
.hdate{display:block;direction:rtl;font-size:19px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gdate{display:block;font-size:11.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv{font-size:10.5px;color:var(--sub);text-align:right;padding:4px 2px 0}

/* sticky: times + rooms */
.stick{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 12px 8px}
.seg3{display:flex;background:#E7E7EC;border-radius:11px;padding:3px;gap:3px}
.seg3 button{flex:1;border-radius:8px;padding:6px 2px 7px;text-align:center}
.seg3 .a{font-size:16px;font-weight:600;color:var(--sub2)}
.seg3 .b{font-size:11px;height:14px;color:var(--sub);margin-top:1px}
.seg3 button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg3 button.on .a{color:var(--text)}
.seg3 .b.out{color:var(--red);font-weight:600}
.seg3 .b.done{color:var(--green)}
/* one row of room buttons per floor, rooms 1 to 3 on top; five columns so a
   room number sits in the same place whichever row it is on */
.rooms{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.rooms .rrow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.rooms button{height:34px;border-radius:9px;background:#fff;border:1px solid var(--sep);
  font-size:14px;font-weight:600;color:var(--sub2);position:relative}
.rooms button.done{background:var(--green-l);border-color:#BCE0D2;color:var(--green)}
.rooms button.miss{background:var(--red-l);border-color:#F0C9C6;color:var(--red)}
.rooms button.on{background:var(--text);border-color:var(--text);color:#fff}

/* room bar */
.rbar{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 8px}
.rbar .t{font-size:19px;font-weight:650;letter-spacing:-.01em}
.rbar .t em{font-style:normal;font-size:13px;font-weight:500;color:var(--sub);margin-left:8px}
.rbar .t em.miss{color:var(--red);font-weight:600}

.rbar button{font-size:14px;font-weight:600;color:var(--blue);flex:none;padding-left:12px}
.rbar .rbtn{display:flex;flex:none}

/* plan */
.planwrap{padding:0 12px;touch-action:pan-y}
.plan{position:relative;width:100%;background:var(--floor);
  border-radius:4px;overflow:hidden}
.plan>svg.walls{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wall{stroke:var(--wall);stroke-width:1.6;fill:none;stroke-linecap:square}
.plan.allin{background:#F7FCFA}
.bed{position:absolute;display:flex;flex-direction:column;background:#fff;
  border:1.5px solid #C9CBD2;border-radius:5px;overflow:hidden}
.slot{flex:1;min-height:0;display:flex;padding:6px 6px 5px;gap:4px;position:relative;
  border-bottom:1.5px solid #C9CBD2}
.slot:last-child{border-bottom:none}
.slot.col{flex-direction:column;align-items:stretch;justify-content:center}
.slot.col .nb{flex:0 0 auto}
.slot.row{flex-direction:row;align-items:center}
.slot.in{background:var(--green-l)}
.slot.out{background:var(--red-l)}
.slot.exc,.slot.away{background:var(--grey-l)}
.nb{flex:1;min-width:0;text-align:left;padding:1px 0;display:block}
.slot.col .nb{text-align:center}
.ln{display:block;font-size:13px;font-weight:650;letter-spacing:-.015em;line-height:1.12;overflow:hidden}
.slot.row .ln{white-space:nowrap;text-overflow:ellipsis}
.slot.col .ln{white-space:normal;overflow-wrap:anywhere}
.fn{display:block;font-size:9.5px;color:var(--sub);line-height:1.16;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
.slot.row .fn{font-size:9px}
.slot.row .mk button{width:26px;height:26px}
.slot.row .mk .e{width:22px}
.slot.out .ln{color:var(--red)}
.slot.exc .ln,.slot.exc .fn,.slot.away .ln,.slot.away .fn{color:var(--grey)}
/* excused is rare enough to live in the person's sheet, so a bed has no button for it; anyone off
   the walk gets a word in place of the buttons */
.slot.away .mk,.slot.exc .mk{display:none}
.slot.away .nb::after,.slot.exc .nb::after{content:"Not in town";display:block;font-size:11px;font-weight:650;color:var(--blue);margin-top:2px}
.slot.exc .nb::after{content:"Excused";color:var(--grey)}
.bunk{position:absolute;top:3px;left:7px;font-size:9px;font-weight:500;color:#B7B9C2}
.slot.col .nb{padding-top:7px}
.mk{display:flex;gap:3px;flex:none}
.slot.col .mk{margin-top:4px;justify-content:center}
.mk button{width:31px;height:30px;border-radius:7px;background:#EDEEF2;display:grid;place-items:center;color:#9A9CA6}
.mk svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.9;stroke-linecap:round;stroke-linejoin:round}
.mk .e{font-size:11px;font-weight:700;width:24px}
.mk button:active{background:#DEDFE6}
.mk .v-in.on{background:var(--green);color:#fff}
.mk .v-out.on{background:var(--red);color:#fff}
.mk .e.on{background:var(--grey);color:#fff}
.viewrow{display:flex;align-items:center;gap:6px;margin-top:8px}
.seg2{display:flex;background:#E7E7EC;border-radius:9px;padding:2px;gap:2px;flex:1}
.seg2 button{flex:1;border-radius:7px;padding:7px 4px;font-size:13px;font-weight:550;color:var(--sub2)}
.seg2 button.on{background:#fff;color:var(--text);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.13)}
.roomblock{margin-bottom:6px;scroll-margin-top:150px}
.revbar{margin-bottom:10px}
.rvhead{display:flex;justify-content:flex-end;gap:0;padding:0 18px 4px 0}
.rvhead span{width:34px;text-align:center;font-size:10.5px;color:var(--sub);font-weight:600}
.rvs{flex:none;display:flex;gap:0}
.rv{width:34px;text-align:center;font-size:14px;font-weight:700}
.rv.g{color:var(--green)}
.rv.r{color:var(--red)}
.rv.e{color:var(--grey);font-size:12px}
.rv.t{color:var(--blue);font-size:12px}
.rv.n{color:#C9CBD2}
.next{padding:12px 12px 6px;display:flex;gap:8px}
.next button{flex:1;background:#fff;border:1px solid var(--sep);border-radius:11px;padding:13px;
  font-size:14.5px;font-weight:600;color:var(--blue);
  display:flex;align-items:center;justify-content:center;gap:6px}
.next button:active{background:var(--blue-l)}
.next button:disabled{color:var(--sub);opacity:.5}

/* closed record */
.lock{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--blue-l);
  border-radius:11px;padding:11px 14px;margin:12px;font-size:13.5px;color:#0B4F9E;font-weight:500}
.lock button{font-size:14.5px;font-weight:650;color:var(--blue)}
.sumh{display:flex;align-items:baseline;justify-content:space-between;padding:18px 16px 7px}
.sumh .a{font-size:16px;font-weight:650}
.sumh .b{font-size:13px;font-weight:600}
.sumh .b.r{color:var(--red)} .sumh .b.g{color:var(--green)} .sumh .b.d{color:var(--sub)}

/* bottom */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(242,242,247,.94);
  backdrop-filter:blur(14px);border-top:.5px solid var(--sep)}
.bar .st{flex:1;min-width:0;font-size:13px;color:var(--sub2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .st b{color:var(--text);font-weight:600}
.bar .st b.r{color:var(--red)}
.bar .fbtn{flex:none;background:var(--blue);color:#fff;font-size:15px;font-weight:650;
  border-radius:10px;padding:12px 18px}
.bar .fbtn:active{opacity:.8}
.bar .cp{flex:none;background:var(--text);color:#fff;font-size:15px;font-weight:650;
  border-radius:10px;padding:12px 22px}
.bar .cp:active{opacity:.8}

/* panels */
.pan{padding:12px}
h2{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sub2);margin:20px 4px 7px}
.blk{background:var(--card);border-radius:13px;overflow:hidden;margin-bottom:9px}
.li{display:flex;align-items:center;gap:11px;padding:12px 14px;position:relative;text-align:left;width:100%}
.li+.li::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--sep)}
.li .a{flex:1;min-width:0;font-size:15px}
.li .a i{display:block;font-style:normal;font-size:12px;color:var(--sub);margin-top:1px}
.li .z{font-size:13px;color:var(--sub);flex:none}
.li .lnk{color:var(--blue);font-weight:550}
.li.dz .a{color:var(--red)}
/* who's-missing: a picked name reads as out, the way the plan draws an out bed */
.li.miss{background:var(--red-l)}
.li.miss .a{color:var(--red);font-weight:600}
.srch{width:100%;background:var(--card);border:none;border-radius:11px;padding:12px 14px;
  font:inherit;font-size:15px;color:var(--text);margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chip{background:var(--red-l);color:var(--red);font-size:13px;font-weight:600;
  border-radius:9px;padding:7px 10px}
.bar .fbtn.wide{flex:1}
/* yeshiva calendar: blue seder, amber off, green away */
.lu{--amber:#9A5B08;--amber-l:#FBF1DF}
.lu .k-zman{--k:var(--blue);--kl:var(--blue-l)}
.lu .k-off{--k:var(--amber);--kl:var(--amber-l)}
.lu .k-trip{--k:var(--green);--kl:var(--green-l)}
.lu-now{background:var(--card);border-radius:16px;padding:14px 16px 8px;margin-bottom:14px}
.lu-today{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub2)}
.lu-today b{color:var(--blue)}
.lu-today .g{color:var(--sub)}
.lu-now .big{font-size:27px;font-weight:700;margin-top:6px}
.lu-now .big.k-off,.lu-now .big.k-trip{color:var(--k)}
.lu-now .sub{font-size:13px;color:var(--sub2);margin-bottom:12px}
.lu-bar{position:relative;height:10px;border-radius:5px;background:var(--grey-l);overflow:hidden;margin-bottom:4px}
.lu-bar i{position:absolute;top:0;bottom:0;inset-inline-start:0;background:var(--blue)}
.lu-bar i.k-off,.lu-bar i.k-trip{background:var(--k)}
.lu-bar i.k-bein{background:var(--sub)}
.lu-bar s{position:absolute;top:0;bottom:0;background:var(--kl)}
.lu-bar s.gone{background:var(--k);opacity:.55}
.lu-nx{border-top:.5px solid var(--sep);margin-top:12px}
.lu-nx .lbl{font-size:11.5px;font-weight:700;color:var(--sub);padding-top:10px}
.lu-nx .lu-row{padding-left:0;padding-right:0}
.lu-z{background:var(--card);border-radius:16px;overflow:hidden}
.lu-z.cur{box-shadow:0 0 0 1.5px var(--blue) inset}
.lu-z .hd2{display:flex;align-items:center;gap:10px;padding:14px 16px 12px 14px}
.lu-z .ttl{flex:1;min-width:0}
.lu-z.off .ttl{opacity:.5}
.lu-z .nm{font-size:19px;font-weight:700;display:flex;align-items:center}
.lu-z .hr{font-size:13px;color:var(--sub2);margin-top:2px}
.lu-z .gr{font-size:12px;color:var(--sub)}
.lu-z .rows{border-top:.5px solid var(--sep);padding:4px 0 6px}
.lu-z .offt{font-size:12.5px;color:var(--sub);padding:0 16px 14px}
.lu-pill{font-size:11px;font-weight:700;color:var(--sub2);background:var(--grey-l);border-radius:8px;padding:2px 8px;margin-inline-start:8px}
.lu-pill.now{color:#fff;background:var(--blue)}
.lu-row{display:flex;align-items:center;gap:12px;padding:8px 16px}
.lu-row.past{opacity:.42}
.lu-tile{flex:none;width:46px;height:50px;border-radius:11px;background:var(--kl);color:var(--k);display:grid;place-content:center;text-align:center}
.lu-tile b{font-size:18px;line-height:20px}
.lu-tile i{font-style:normal;font-size:10.5px;line-height:12px}
.lu-gap .lu-tile{background:rgba(255,255,255,.75)}
.lu-tx{flex:1;min-width:0}
.lu-tx .t{font-size:15.5px;font-weight:600}
.lu-tx .n{font-size:12.5px;color:var(--sub2)}
.lu-tx .w{font-size:12.5px;color:var(--sub)}
.lu-cd{flex:none;font-size:12px;color:var(--sub)}
.lu-cd.next{font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-l);border-radius:8px;padding:2px 8px}
.lu-gap{margin:4px 8px;border-radius:13px;background:var(--kl)}
.lu-gap .lu-row{padding:8px}
.lu-gap .len{font-size:11.5px;font-weight:700;color:var(--k);padding-inline-start:66px;margin-bottom:2px}
.lu-bein{display:flex;align-items:center;gap:12px;padding:14px 0;text-align:center}
.lu-bein s{flex:1;height:1px;background:var(--sep)}
.lu-bein .t{font-size:14px;font-weight:700;color:var(--sub2);display:flex;align-items:center;justify-content:center}
.lu-bein .c{font-size:11.5px;color:var(--sub)}
.lu-bein.now s{background:var(--blue)}
.lu-bein.now .t{color:var(--blue)}
.lu-foot{text-align:center;font-size:12px;color:var(--sub);padding:18px 0 30px}
.lu-ctl{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.lu-ctl .seg2{flex:none}
.lu-ctl .seg2 button{padding:5px 13px}
.lu .d-zman{--dk:var(--blue-l);--dd:var(--blue)}
.lu .d-off{--dk:var(--amber-l);--dd:var(--amber)}
.lu .d-trip{--dk:var(--green-l);--dd:var(--green)}
.lu .d-bein{--dk:transparent;--dd:var(--sub)}
.lu-mc{background:var(--card);border-radius:16px;padding:12px 10px}
.lu-mh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.lu-mh .mt{flex:1;text-align:center}
.lu-mh .t{font-size:18px;font-weight:700}
.lu-mh .s{font-size:12px;color:var(--sub)}
.lu-mh .arr{width:36px;height:36px;border-radius:10px;background:var(--blue-l);color:var(--blue);font-size:22px;font-weight:700}
.lu-mh .arr:disabled{background:none;color:var(--sep)}
.lu-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.lu-heads{margin-bottom:4px}
.lu-heads span{text-align:center;font-size:11.5px;font-weight:700;color:var(--sub)}
.lu-d{height:52px;border-radius:10px;background:var(--dk);display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid transparent}
.lu-d b{font-size:15px;line-height:17px;color:var(--text)}
.lu-d.d-bein b{color:var(--sub2)}
.lu-d i{font-style:normal;font-size:9px;line-height:11px;color:var(--sub);white-space:nowrap}
.lu-d u{display:block;width:5px;height:5px;border-radius:50%;margin-top:2px;background:var(--k,transparent)}
.lu-d.past{opacity:.55}
.lu-d.today{border-color:var(--text)}
.lu-d.pick{border-color:var(--blue)}
.lu-legend{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:11px;color:var(--sub2)}
.lu-legend span{display:flex;align-items:center;gap:4px}
.lu-legend span::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--dk);box-shadow:0 0 0 1px var(--dd) inset;opacity:.85}
.lu-legend .d-bein::before{background:#fff}
.lu-day,.lu-ml,.lu-sc{background:var(--card);border-radius:16px;margin-top:10px}
.lu-day{padding:12px 16px 6px}
.lu-day .top{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.lu-day .top span{font-size:12.5px;color:var(--sub)}
.lu-day .what{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--sub2);padding:4px 0}
.lu-day .what s{width:9px;height:9px;border-radius:50%;background:var(--dd)}
.lu-day .what span{font-size:12.5px;font-weight:400;color:var(--sub);margin-inline-start:4px}
.lu-day .lu-row{padding-left:0;padding-right:0}
.lu-ml{padding:6px 0}
.lu-ml .h{font-size:12px;font-weight:700;color:var(--sub);padding:8px 16px 2px}
.lu-ml .none{font-size:13.5px;color:var(--sub);padding:6px 16px 12px}
.lu-sc{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px}
.lu-sc>div{flex:1}
.lu-sc b{display:block;font-size:15px}
.lu-sc i{display:block;font-style:normal;font-size:12px;color:var(--sub)}
.sw{flex:none;width:44px;height:26px;border-radius:13px;background:#D7D8DE;position:relative;transition:background .15s}
.sw i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on{background:var(--blue)}
.sw.on i{transform:translateX(18px)}
.ck{width:22px;height:22px;border-radius:7px;border:1.5px solid #C6C8D4;flex:none;position:relative;background:#fff}
.ck.on{background:var(--green);border-color:var(--green)}
.ck.on::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}
.none{font-size:13.5px;color:var(--sub);padding:16px;text-align:center}
.btn{display:block;width:100%;text-align:center;background:var(--blue);color:#fff;font-size:15px;
  font-weight:650;border-radius:11px;padding:13px}
.btn.gh{background:#fff;color:var(--blue);border:1px solid var(--sep)}
.rep{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55;
  white-space:pre-wrap;border-radius:10px;resize:vertical}

/* calendar */
.cnav{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
.cnav .m{font-size:17px;font-weight:650;text-align:center}
.cnav .m i{display:block;font-style:normal;font-size:11.5px;color:var(--sub);font-weight:400;margin-top:1px}
.cnav button{width:36px;height:36px;border-radius:10px;background:var(--blue-l);color:var(--blue);
  font-size:17px;font-weight:600;display:grid;place-items:center;flex:none}
.dow{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px 4px}
.dow div{text-align:center;font-size:12px;color:var(--sub);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 8px 12px}
.cell{height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;position:relative}
.cell .h{font-size:15px;font-weight:600}
.cell .g{font-size:9.5px;color:var(--sub)}
.cell.sat{background:#F5F6FA}
.cell.has::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--blue)}
.cell.today{box-shadow:inset 0 0 0 1.5px var(--blue)}
.cell.on{background:var(--blue)}
.cell.on .h{color:#fff} .cell.on .g{color:rgba(255,255,255,.75)}
.cell.on.has::after{background:#fff}
.cell.empty{visibility:hidden}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,20,.4);z-index:70;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.pop{position:fixed;left:8px;right:8px;bottom:8px;z-index:80;max-height:90vh;overflow-y:auto;
  transform:translateY(calc(100% + 14px));transition:transform .22s cubic-bezier(.24,.8,.3,1)}
.pop.on{transform:translateY(0)}
.pop .grp{background:#fff;border-radius:15px;overflow:hidden;margin-bottom:8px}
.pop .hdd{padding:14px;text-align:center;border-bottom:.5px solid var(--sep)}
.pop .hdd .a{font-size:16.5px;font-weight:650}
.pop .hdd .b{font-size:12.5px;color:var(--sub);margin-top:2px}
.pop .cancel{width:100%;background:#fff;border-radius:15px;padding:15px;font-size:16px;
  font-weight:650;color:var(--blue);margin-bottom:env(safe-area-inset-bottom)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,8px);
  background:rgba(18,18,26,.94);color:#fff;font-size:13.5px;font-weight:500;padding:9px 17px;
  border-radius:10px;z-index:90;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* password gate */
.gate{min-height:72vh;display:grid;place-items:center;padding:22px}
.gbox{width:100%;max-width:330px;background:var(--card);border-radius:15px;padding:24px 20px 19px;text-align:center}
.gbox .gt{font-size:21px;font-weight:650;letter-spacing:-.01em}
.gbox .gs{font-size:13.5px;color:var(--sub);margin:5px 0 17px}
.gbox input{text-align:center}
.gerr{font-size:13px;color:var(--red);height:17px;margin:7px 0 3px}
.gn{font-size:11.5px;color:var(--sub);margin-top:13px;line-height:1.4}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>
<div class="scrim" id="scrim"></div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* Three rounds stand every night. Anything else belongs to the ONE night it was added to - the
   zman moved, or you went round again at 1:30 - so it lives on the night beside its marks and the
   next night starts from the standing three with nothing to put back.
   Ids read like a clock face, not a 24-hour one: "1115" is quarter past eleven at night and
   "1200" is midnight. That is how every night ever marked is filed, so the scheme stays - and it
   means ids cannot be sorted as numbers, since 12 falls after 11 but before 1. */
const BASE_SLOTS=[{id:"1115",label:"11:15"},{id:"1130",label:"11:30"},{id:"1200",label:"12:00"}];
const slotHour=id=>parseInt(id.slice(0,2),10)||0, slotMin=id=>parseInt(id.slice(2),10)||0;
/* 6pm…11pm, then midnight, then 1am…5am - the order the rounds are actually walked. */
const nightHour=h=>h===12?12:(h<6?h+12:h);
const slotOrder=id=>nightHour(slotHour(id))*60+slotMin(id);
const slotLabel=id=>slotHour(id)+":"+String(slotMin(id)).padStart(2,"0");
const validSlot=id=>/^\d{4}$/.test(id)&&slotHour(id)>=1&&slotHour(id)<=12&&slotMin(id)<=59;
const idForClock=(h24,m)=>String(h24%12===0?12:h24%12).padStart(2,"0")+String(m).padStart(2,"0");
/* Every round this night can be marked at. A round the night already has marks in counts too,
   even if nothing declared it, so a round removed by mistake does not take its marks off the
   screen with it. */
const allSlots=(n)=>{
  n=n||state.night||{};
  const declared=(n.slots||[]).filter(validSlot);
  /* a night that names its own rounds gets those INSTEAD of the standing three, so a night with
     one check at 12:30 has exactly one column */
  const base=declared.length?declared:BASE_SLOTS.map(s=>s.id);
  /* a round with marks in it counts too, so an older night keeps the columns it was marked in */
  const marked=Object.keys(n.marks||{}).filter(s=>validSlot(s)&&Object.keys(n.marks[s]||{}).length);
  return [...new Set([...base,...marked])]
    .map(id=>({id,label:slotLabel(id)}))
    .sort((a,b)=>slotOrder(a.id)-slotOrder(b.id));
};
/* All of them unless this night narrowed it - and if the narrowing names nothing that still
   exists, all of them again, so removing a round cannot leave a blank sheet. */
const sheetSlots=(n)=>{
  n=n||state.night||{};
  const every=allSlots(n), pick=n.sheet||[];
  if(!pick.length)return every;
  const kept=every.filter(s=>pick.includes(s.id));
  return kept.length?kept:every;
};
const RKEY="dorm-plan-v1", MKEY="dorm-mirror-v1", NPRE="dn:";
const IC={
  tick:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.6l4.6 4.6L19 7.2"/></svg>`,
  ex:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 6.6l10.8 10.8M17.4 6.6L6.6 17.4"/></svg>`,
  undo:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7H15.5A4.5 4.5 0 0 1 20 11.5A4.5 4.5 0 0 1 15.5 16H10"/><path d="M10.5 3.5L6 7l4.5 3.5"/></svg>`,
  eye:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>`,
  grid:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.3"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.3"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.3"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.3"/></svg>`,
  one:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/></svg>`,
  more:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.8" fill="currentColor" stroke="none"/></svg>`
};

/* ---- people: English first/last, then the same in Hebrew ----
   Hebrew is stored as its own first and last rather than split off one string: "יהודה לייב גור ארי׳"
   has a two-word surname, so any rule that cuts at the last space gets that one wrong. */
const P={
 p1:["Shlomo","Altein","שלמה","אלטיין"],
 p2:["Yosef","Lehr","יוסף","לעהר"],
 p3:["Menachem Mendel","Piekarski","מנחם מענדל","פיקארסקי"],
 p4:["Dovber","Pevzner","דובער","פעוזנער"],
 p5:["Sholom","Holtzberg","שלום","הולצברג"],
 p6:["Menachem Mendel","Stolik","מנחם מענדל","סטאליק"],
 p7:["Avrohom","Raices","אברהם","רייצעס"],
 p8:["Menachem Mendel","Levin","מנחם מענדל","לוין"],
 p9:["Avrohom","Heidingsfeld","אברהם","היידינגספעלד"],
 p10:["Menachem Mendel","Hirsch","מנחם מענדל","הירש"],
 p11:["Asher","Wolfe","אשר","וואלף"],
 p12:["Yaakov","Tzfasman","יעקב","צפתמן"],
 p13:["Dovid","Altein","דוד","אלטיין"],
 p14:["Menachem Mendel","Goldstein","מנחם מענדל","גאלדשטיין"],
 p15:["Nochum","Groner","נחום","גראנער"],
 p16:["Menachem Mendel","Palace","מנחם מענדל","פאלאס"],
 p17:["Moshe Eliezer","Backman","משה אליעזר","באקמאן"],
 p18:["Shmuel","Browd","שמואל","בראוד"],
 p19:["Menachem Mendel HaLevi","Flint","מנחם מענדל הלוי","פלינט"],
 p20:["Shlomo","Schwei","שלמה","שוויי"],
 p21:["Yaakov","Belinitzki","יעקב","בליניצקי"],
 p22:["Chaim Yehoshua","Brenenson","חיים יהושע","ברענענסאן"],
 p23:["Yehuda Leib","Gourarie","יהודה לייב","גור ארי׳"],
 p24:["Leib Meir","November","לייב מאיר","נאוועמבער"],
 p25:["Sadya","Liberow","סעדי׳","ליבעראוו"],
 p26:["Yitzchok Sholom","Lipkind","יצחק שלום","ליפקינד"],
 p27:["Dovid","Fridman","דוד","פרידמאן"],
 p28:["Tzvi Dov HaLevi","Levitansky","צבי דוב הלוי","לויטנסקי"],
 p29:["Yehuda","Fehler","יהודה","פעלער"],
 p30:["Meir Shlomo","Ceitlin","מאיר שלמה","ציטלין"],
 p31:["Mordechai Shlomo","Smith","מרדכי שלמה","סמיט"]
};
/* p27 Fridman and p30 Ceitlin have left. They stay above so the nights they were in still read
   with their names; being on no bed below is what takes them off the check. */
/* ---- floor plans ----
   Kept identical to the Android app, on purpose: same rooms, same beds, same doors, so whoever
   is covering sees the same picture whichever one they open. Coordinates are the room INTERIOR
   in bed units; every room carries its own w and h, because they are not all the same size.
   One bed footprint everywhere, turned 90 degrees to run along whichever wall it is against. */
const BED_SHORT=32, BED_LONG=60;
const bedV=(x,y,slots)=>({x,y,w:BED_SHORT,h:BED_LONG,slots});   /* against a side wall */
const bedH=(x,y,slots)=>({x,y,w:BED_LONG,h:BED_SHORT,slots});   /* against the top or bottom */
/* Rooms 1 to 3 are downstairs; every other room is upstairs. Same as the app's Roster. */
const BOTTOM_FLOOR=["r1","r2","r3"];
const PLAN=[
 {id:"r1",label:"Room 1",heb:"חדר א׳",w:100,h:78,door:{wall:"bottom",pos:38},beds:[
   bedH(38,2,["p3","p4"]), bedH(38,44,["p2","p1"])]},
 {id:"r2",label:"Room 2",heb:"חדר ב׳",w:100,h:78,door:{wall:"bottom",pos:85},beds:[
   bedV(2,2,["p8","p5"]), bedH(38,2,["p7","p6"])]},
 {id:"r3",label:"Room 3",heb:"חדר ג׳",w:100,h:118,door:{wall:"bottom",pos:70},beds:[
   bedH(38,2,["p10"]), bedV(2,42,["p9"]), bedV(66,42,["p11","p12"])]},
 /* wider room: the two singles lie end to end along the top wall, bunk on the right wall */
 {id:"r4",label:"Room 4",heb:"חדר ד׳",w:126,h:104,door:{wall:"bottom",pos:26},beds:[
   bedH(2,2,["p15"]), bedH(64,2,["p14"]), bedV(92,42,["p13","p16"])]},
 {id:"r5",label:"Room 5",heb:"חדר ה׳",w:100,h:92,door:{wall:"left",pos:76},beds:[
   bedV(2,2,["p20","p18"]), bedV(66,2,["p17","p19"])]},
 /* real door is on the far wall; drawn a half-turn round so you see it as you walk in */
 {id:"r6",label:"Room 6",heb:"חדר ו׳",w:100,h:78,door:{wall:"bottom",pos:28},beds:[
   bedV(2,2,["p23","p24"]), bedV(66,2,["p22","p21"])]},
 {id:"r7",label:"Room 7",heb:"חדר ז׳",w:100,h:88,door:{wall:"bottom",pos:14},beds:[
   bedH(38,2,["p26"]), bedH(38,54,["p25"])]},
 {id:"r8",label:"Room 8",heb:"חדר ח׳",w:100,h:96,door:{wall:"left",pos:80},beds:[
   bedH(2,2,["p29","p31"]), bedV(66,32,["p28"])]}
];

let state={night:null,dateKey:null,cur:"1115",room:0,tab:"check",who:null,mode:"one",review:false,onlyOut:false,
  ok:true,persist:true,lastSave:null,editing:false,cal:null,calHas:{},extra:{},
  /* off by default: the plan reads cleaner without them, and Names can switch them back on */
  settings:{bunkLabels:false,hebrewOnPlan:false,hebrewInExport:false,syncUrl:"",syncToken:"",
    /* the yeshiva calendar in English, and as the year's list rather than a month - this device's own choice */
    luachEnglish:false,luachList:false},
  syncMsg:"",syncing:false,lastPull:0,dirty:[]};
let undoStack=[];

/* ---------- storage ---------- */
const mem={};
let LS=null;
try{ if(window.localStorage){ window.localStorage.setItem("__t","1"); window.localStorage.removeItem("__t"); LS=window.localStorage; } }catch(e){ LS=null; }
const store={
  async get(k){
    if(window.storage&&state.ok){try{const r=await window.storage.get(k,false);if(r)return r.value;}catch(e){}}
    if(LS){try{const v=LS.getItem(k);if(v!==null)return v;}catch(e){}}
    return mem[k]??null;
  },
  async set(k,v){
    mem[k]=v; let done=false;
    if(window.storage&&state.ok){try{await window.storage.set(k,v,false);done=true;}catch(e){state.ok=false;}}
    if(LS){try{LS.setItem(k,v);done=true;}catch(e){}}
    return done;
  },
  async list(p){
    if(window.storage&&state.ok){try{const r=await window.storage.list(p,false);if(r&&r.keys&&r.keys.length)return r.keys;}catch(e){}}
    if(LS){try{const o=[];for(let i=0;i<LS.length;i++){const k=LS.key(i);if(k&&k.startsWith(p))o.push(k);}if(o.length)return o;}catch(e){}}
    return Object.keys(mem).filter(k=>k.startsWith(p));
  }
};
let sT=null,saving=false;
function save(){
  if(state.dateKey&&!state.dirty.includes(state.dateKey))state.dirty.push(state.dateKey);
  clearTimeout(sT);sT=setTimeout(flush,250);
  /* marking a room is a burst of taps - let it settle before telling the server */
  if(state.settings.syncUrl){clearTimeout(pushT);pushT=setTimeout(()=>syncNow(false),4000);}
}
let pushT=null;

/* ---------- sync ----------
   Offline-first: this browser's own copy is the truth and every mark works with no signal. Sync
   is reconciliation on top, never a gate in front - the check happens at 11pm in a building with
   bad reception. Nothing is overwritten wholesale; everything goes through mergeNights. */
async function syncPost(path,body){
  const base=state.settings.syncUrl.replace(/\/+$/,"");
  const r=await fetch(base+path,{method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+state.settings.syncToken},
    body:JSON.stringify(body)});
  if(r.status===401)throw new Error("Wrong sync password");
  if(!r.ok)throw new Error("Server said "+r.status);
  return r.json();
}
async function adoptNight(date,remote){
  /* The open night lives in memory and may be ahead of storage, so merge against THAT. Reading
     the stored copy instead loses whatever was marked in the last few hundred milliseconds. */
  let local=null;
  if(date===PEOPLE_DATE){
    const merged=mergeNights(people,norm(remote));
    if(JSON.stringify(people||blank())===JSON.stringify(merged))return false;
    people=merged; state.extra=extraFrom(people);
    await store.set(NPRE+PEOPLE_DATE,JSON.stringify(people));
    return true;
  }
  if(date===state.dateKey){ local=state.night; }
  else { const raw=await store.get(NPRE+date); if(raw){try{local=norm(JSON.parse(raw));}catch(e){}} }
  const merged=mergeNights(local,norm(remote));
  const before=JSON.stringify(local||blank()), after=JSON.stringify(merged);
  if(before===after)return false;
  await store.set(NPRE+date,JSON.stringify(merged));
  if(date===state.dateKey)state.night=merged;   /* the open night has to redraw with what arrived */
  return true;
}
async function syncNow(loud){
  if(!state.settings.syncUrl){if(loud)toast("No sync address set");return;}
  if(state.syncing)return;
  /* writes are debounced, so flush before reading anything back off storage to send - otherwise
     the push is of a night that does not yet contain what was just marked */
  await flush();
  if(state.syncing)return;
  state.syncing=true; state.syncMsg="Syncing…"; if(loud)render();
  try{
    let changed=0;
    if(state.dirty.length){
      const nights={};
      for(const d of state.dirty){const raw=await store.get(NPRE+d); if(raw){try{nights[d]=JSON.parse(raw);}catch(e){}}}
      const res=await syncPost("/push",{nights});
      for(const [date,n] of Object.entries(res.nights||{}))if(await adoptNight(date,n))changed++;
      state.dirty=[];
    }
    const res=await syncPost("/pull",{since:state.lastPull||0});
    for(const [date,n] of Object.entries(res.nights||{}))if(await adoptNight(date,n))changed++;
    state.lastPull=res.now||state.lastPull;
    state.syncMsg="Last synced "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}).toLowerCase();
    state.syncing=false;
    await flush();
    if(changed)render();
    if(loud)toast(changed?("Synced · "+changed+" night"+(changed===1?"":"s")+" updated"):"Synced");
  }catch(e){
    state.syncing=false; state.syncMsg=e.message||"Could not reach the server";
    if(loud){toast(state.syncMsg);render();}
  }
}
async function flush(){
  clearTimeout(sT); if(saving)return; saving=true;
  try{
    await store.set(RKEY,JSON.stringify({extra:state.extra,mode:state.mode,settings:state.settings,lastPull:state.lastPull,dirty:state.dirty}));
    await store.set(NPRE+state.dateKey,JSON.stringify(state.night));
    await store.set(MKEY,JSON.stringify({at:Date.now(),date:state.dateKey,night:state.night,extra:state.extra}));
    state.lastSave=new Date();
    const e=document.getElementById("sv"); if(e)e.textContent=savedText();
  }finally{saving=false;}
}
const savedText=()=>!state.persist?"not saving on this device":
  state.lastSave?"saved "+state.lastSave.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}).toLowerCase():"saved";
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush();});
window.addEventListener("pagehide",flush);

/* ---------- dates ---------- */
const pad=n=>n<10?"0"+n:""+n;
const GML=[31,28,31,30,31,30,31,31,30,31,30,31];
const gLeap=y=>(y%4===0&&y%100!==0)||y%400===0;
const gML=(m,y)=>m===2&&gLeap(y)?29:GML[m-1];
function gAbs(y,m,d){let a=365*(y-1)+Math.floor((y-1)/4)-Math.floor((y-1)/100)+Math.floor((y-1)/400);
  for(let i=0;i<m-1;i++)a+=GML[i]; if(m>2&&gLeap(y))a++; return a+d;}
function absToG(abs){let y=Math.floor(abs/366);while(abs>=gAbs(y+1,1,1))y++;
  let m=1;while(abs>gAbs(y,m,gML(m,y)))m++;return{y,m,d:abs-gAbs(y,m,1)+1};}
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey=k=>{const p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);};
const keyFromAbs=a=>{const g=absToG(a);return g.y+"-"+pad(g.m)+"-"+pad(g.d);};
const absOfKey=k=>{const p=k.split("-");return gAbs(+p[0],+p[1],+p[2]);};
function tonightKey(at){const n=at?new Date(at):new Date();if(n.getHours()<6)n.setDate(n.getDate()-1);return keyOf(n);}
const longDate=k=>parseKey(k).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
const shiftDate=(k,n)=>keyFromAbs(absOfKey(k)+n);

const HEB_EPOCH=-1373427;
const hLeap=y=>((y*7+1)%19)<7, hMonths=y=>hLeap(y)?13:12;
function hElapsed(y){const me=Math.floor((235*y-234)/19),pe=12084+13753*me;
  let d=29*me+Math.floor(pe/25920); if(((3*(d+1))%7)<3)d++; return d;}
function hNewYear(y){const l=hElapsed(y-1),p=hElapsed(y),n=hElapsed(y+1);
  let dl=0; if(n-p===356)dl=2; else if(p-l===382)dl=1; return HEB_EPOCH+p+dl;}
const hYearLen=y=>hNewYear(y+1)-hNewYear(y);
function hML(m,y){
  if(m===2||m===4||m===6||m===10||m===13)return 29;
  if(m===12&&!hLeap(y))return 29;
  if(m===8&&hYearLen(y)%10!==5)return 29;
  if(m===9&&hYearLen(y)%10===3)return 29;
  return 30;
}
function hToAbs(y,m,d){let a=d;
  if(m<7){for(let i=7;i<=hMonths(y);i++)a+=hML(i,y);for(let i=1;i<m;i++)a+=hML(i,y);}
  else{for(let i=7;i<m;i++)a+=hML(i,y);}
  return a+hNewYear(y)-1;}
function absToH(abs){let y=Math.floor((abs-HEB_EPOCH)/366);
  while(abs>=hToAbs(y+1,7,1))y++;
  let m=(abs<hToAbs(y,1,1))?7:1;
  while(abs>hToAbs(y,m,hML(m,y)))m++;
  return{y,m,d:abs-hToAbs(y,m,1)+1};}

  snap();

  for(const sid of allSlots().map(s=>s.id))if(!want.includes(sid)){

/* ---------- floor plan drawing ----------

   axes divide by the same total, so one unit across is one unit down and a bed turned sideways

const MARGIN=5, GAP=7, DOOR_D=4;    /* GAP is half the doorway; DOOR_D how far the box juts out */
const totalW=r=>r.w+2*MARGIN, totalH=r=>r.h+2*MARGIN;
function wallsSVG(room){
  const W=room.w, H=room.h, d=room.door, p=d.pos, seg=[];
  const L=(x1,y1,x2,y2)=>seg.push(`M${x1} ${y1}L${x2} ${y2}`);
  const a=p-GAP, b=p+GAP;

  if(d.wall!=="bottom") L(0,H,W,H);
  if(d.wall!=="left")   L(0,0,0,H);
  if(d.wall!=="right")  L(W,0,W,H);
  /* the door's own wall is split around the gap, with a three-sided box just outside it */
  if(d.wall==="bottom"){L(0,H,a,H);L(b,H,W,H);const o=H+DOOR_D;L(a,H,a,o);L(a,o,b,o);L(b,o,b,H);}
  if(d.wall==="top")   {L(0,0,a,0);L(b,0,W,0);const o=-DOOR_D;   L(a,0,a,o);L(a,o,b,o);L(b,o,b,0);}
  if(d.wall==="left")  {L(0,0,0,a);L(0,b,0,H);const o=-DOOR_D;   L(0,a,o,a);L(o,a,o,b);L(o,b,0,b);}
  if(d.wall==="right") {L(W,0,W,a);L(W,b,W,H);const o=W+DOOR_D;  L(W,a,o,a);L(o,a,o,b);L(o,b,W,b);}
  return `<svg class="walls" viewBox="${-MARGIN} ${-MARGIN} ${totalW(room)} ${totalH(room)}" aria-hidden="true">
    ${seg.map(s=>`<path class="wall" d="${s}"/>`).join("")}
  </svg>`;
}

/* ---------- yeshiva calendar ----------
   The yeshiva's luach for the year - לוח שנת הלימודים תשפ״ו-תשפ״ז - line for line, with the changes
   made since written in, in Hebrew as the luach words it and in English. Each line is a Hebrew date
   as printed (year, month with Nisan 1 to Adar II 13, day) and its time: the Gregorian date and the
   weekday are worked out from it, never typed in beside it, so the two cannot disagree. The same
   lines as the app's Luach.kt.
   Kinds: start/end of a zman, off/back for a break, trip/home for travelling together, and event
   for something that happens with the zman carrying on. */
const LUACH_YEAR="תשפ״ו–תשפ״ז", LUACH_YEAR_EN="5786–5787";
const LUACH=[
 {id:"elul",name:"זמן אלול",nameEn:"Elul zman",days:[
   {h:[5786,6,10],t:"17:30",k:"start",title:"התחלת הזמן",titleEn:"Zman begins"},
   {h:[5786,6,28],k:"event",title:"נסיעה להרבי",titleEn:"Trip to the Rebbe",
     note:"המשך הסדר אחר ר״ה אצל הרבי",noteEn:"Seder continues at the Rebbe after Rosh Hashanah"},
   {h:[5787,7,6],t:"14:00",k:"end",title:"סיום הזמן",titleEn:"Zman ends"}]},
 {id:"winter",name:"זמן חורף",nameEn:"Winter zman",days:[
   {h:[5787,7,27],t:"17:30",k:"start",title:"התחלת הזמן",titleEn:"Zman begins"},
   /* the luach printed Monday כ״ז כסלו to Monday ד׳ טבת; it has since moved to Tuesday to Tuesday */
   {h:[5787,9,28],t:"14:00",k:"off",title:"הפסקה",titleEn:"Break begins",note:"חנוכה",noteEn:"Chanukah",stretchEn:"Chanukah break"},
   {h:[5787,10,5],t:"17:30",k:"back",title:"המשך הזמן",titleEn:"Zman resumes"},
   {h:[5787,12,4],t:"11:00",k:"off",title:"התחלת שבת חופשה",titleEn:"Shabbos off begins",stretch:"שבת חופשה",stretchEn:"Shabbos off"},
   {h:[5787,12,8],t:"20:30",k:"back",title:"המשך הזמן",titleEn:"Zman resumes"},
   {h:[5787,1,5],t:"14:00",k:"end",title:"סיום הזמן",titleEn:"Zman ends"}]},
 /* may not happen, so it can be switched off - see summerOn */
 {id:"summer",name:"זמן קיץ",nameEn:"Summer zman",optional:true,days:[
   {h:[5787,1,28],t:"17:30",k:"start",title:"התחלת הזמן",titleEn:"Zman begins"},
   {h:[5787,4,2],k:"trip",title:"נסיעה לבית חיינו",titleEn:"Trip to Beis Chayeinu",note:"הישיבה יארגן אוטובוס",noteEn:"The yeshiva is arranging a bus"},
   {h:[5787,4,7],k:"home",title:"חזרה לישיבה",titleEn:"Back to yeshiva"},
   {h:[5787,5,15],t:"14:00",k:"end",title:"סיום הזמן",titleEn:"Zman ends"}]}];
const LU_DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], LU_MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const LU_MONTH=["January","February","March","April","May","June","July","August","September","October","November","December"];
const luHebOf=d=>absToH(gAbs(d.getFullYear(),d.getMonth()+1,d.getDate()));   /* the Hebrew date of a day, in daylight */
const luHebEn=h=>h.d+" "+hMNameEn(h.m,h.y);                                     /* "28 Kislev" */
const luKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
LUACH.forEach(z=>z.days.forEach(d=>{
  const g=absToG(hToAbs(d.h[0],d.h[1],d.h[2]));
  d.date=new Date(g.y,g.m-1,g.d);
  const [hh,mm]=(d.t||"00:00").split(":").map(Number);
  d.at=new Date(g.y,g.m-1,g.d,hh,mm);    /* a line with no time counts from the start of its day */
  d.heb=ger(hNum(d.h[2]))+" "+hMName(d.h[1],d.h[0]);
  d.hebEn=luHebEn({y:d.h[0],m:d.h[1],d:d.h[2]});
}));
const luTitle=(d,en)=>en?d.titleEn:d.title, luNote=(d,en)=>en?d.noteEn:d.note, luName=(z,en)=>en?z.nameEn:z.name;
const luGaps=z=>{const o=[];for(let i=0;i+1<z.days.length;i++){const a=z.days[i],b=z.days[i+1];
  if((a.k==="off"&&b.k==="back")||(a.k==="trip"&&b.k==="home"))o.push({from:a,to:b,trip:a.k==="trip"});}return o;};
const luGapName=(g,en)=>en?(g.from.stretchEn||g.from.titleEn):(g.from.stretch||g.from.title);
/* Whether the year has a summer zman. It belongs to the whole yeshiva, so it rides in the shared
   record with everyone's settings and reads the same on every device. */
const NO_SUMMER="yeshiva.noSummer";
const summerOn=()=>!(people&&people.notes&&people.notes[NO_SUMMER]==="1");
const luYear=summer=>LUACH.filter(z=>summer||!z.optional);
const luEnd=z=>z.days[z.days.length-1];
function luNow(at,summer){
  const y=luYear(summer);
  for(let i=0;i<y.length;i++){const z=y[i];
    if(at<z.days[0].at)return {type:"between",after:y[i-1]||null,before:z};
    if(at<luEnd(z).at){
      const g=luGaps(z).find(g=>at>=g.from.at&&at<g.to.at);
      if(g)return {type:"gap",z,gap:g};
      return {type:"zman",z,next:z.days.find(d=>d.at>at)||null};
    }
  }
  return {type:"between",after:y[y.length-1]||null,before:null};
}
/* What a whole day is: seder, a break, a trip, or bein hazmanim. A break's first and last days count
   as the break - each has half a day of it, and it is the break the day is remembered for. */
const luZmanOn=(d,summer)=>luYear(summer).find(z=>d>=z.days[0].date&&d<=luEnd(z).date)||null;
const luGapOn=(d,summer)=>{const z=luZmanOn(d,summer);return z?luGaps(z).find(g=>d>=g.from.date&&d<=g.to.date)||null:null;};
function luDayKind(d,summer){const z=luZmanOn(d,summer);if(!z)return "bein";const g=luGapOn(d,summer);return g?(g.trip?"trip":"off"):"zman";}
const luLinesOn=(d,summer)=>luYear(summer).flatMap(z=>z.days).filter(x=>+x.date===+d);
const luProgress=(a,b,at)=>{const t=b-a;return t<=0?1:Math.max(0,Math.min(1,(at-a)/t));};
const luDays=(a,b)=>Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);
function luLength(n){
  if(n===1)return "1 day";
  if(n%7===0)return n===7?"1 week":(n/7)+" weeks";
  return n<35?n+" days":Math.round(n/7)+" weeks";
}
const luCountdown=(d,today)=>{const n=luDays(today,d);return n===0?"today":n===1?"tomorrow":n<0?null:"in "+n+" days";};
const luDate=(d,yr)=>LU_DOW[d.getDay()]+", "+LU_MON[d.getMonth()]+" "+d.getDate()+(yr?", "+d.getFullYear():"");
const luTime=t=>{const [h,m]=t.split(":").map(Number);return (h%12===0?12:h%12)+":"+String(m).padStart(2,"0")+" "+(h<12?"am":"pm");};
const luWhen=d=>luDate(d.date)+(d.t?" · "+luTime(d.t):"");
/* in English the Gregorian day leads, so the line carries the Hebrew one */
const luWhenEn=d=>LU_DOW[d.date.getDay()]+" · "+d.hebEn+(d.t?" · "+luTime(d.t):"");
function luRange(a,b){const md=d=>LU_MON[d.getMonth()]+" "+d.getDate();
  return a.getFullYear()===b.getFullYear()?md(a)+" – "+md(b)+", "+b.getFullYear():md(a)+", "+a.getFullYear()+" – "+md(b)+", "+b.getFullYear();}

/* The year a month at a time: by Hebrew months, Elul to Av, for the calendar in Hebrew; by the
   regular months, August to August, for the calendar in English. */
const LU_MONTHS={};
function luMonths(en){
  if(LU_MONTHS[en])return LU_MONTHS[en];
  const first=LUACH[0].days[0].date, last=luEnd(LUACH[LUACH.length-1]).date, out=[];
  if(!en){
    let {y,m}=luHebOf(first); const L=luHebOf(last);
    for(;;){const days=[];for(let d=1;d<=hML(m,y);d++){const g=absToG(hToAbs(y,m,d));days.push(new Date(g.y,g.m-1,g.d));}
      const a=days[0], b=days[days.length-1];
      const sub=a.getMonth()===b.getMonth()?LU_MON[a.getMonth()]+" "+a.getFullYear():
        a.getFullYear()===b.getFullYear()?LU_MON[a.getMonth()]+" – "+LU_MON[b.getMonth()]+" "+b.getFullYear():
        LU_MON[a.getMonth()]+" "+a.getFullYear()+" – "+LU_MON[b.getMonth()]+" "+b.getFullYear();
      out.push({title:hMName(m,y)+" "+ger(hNum(y%1000)),sub,days});
      if(y===L.y&&m===L.m)break; ({y,m}=hNext(y,m));}
  }else{
    for(let y=first.getFullYear(),m=first.getMonth();y<last.getFullYear()||(y===last.getFullYear()&&m<=last.getMonth());m===11?(y++,m=0):m++){
      const days=[];for(let d=1;d<=new Date(y,m+1,0).getDate();d++)days.push(new Date(y,m,d));
      const a=luHebOf(days[0]), b=luHebOf(days[days.length-1]);
      const sub=a.m===b.m?hMNameEn(a.m,a.y)+" "+a.y:a.y===b.y?hMNameEn(a.m,a.y)+" – "+hMNameEn(b.m,b.y)+" "+b.y:
        hMNameEn(a.m,a.y)+" "+a.y+" – "+hMNameEn(b.m,b.y)+" "+b.y;
      out.push({title:LU_MONTH[m]+" "+y,sub,days});
    }
  }
  return LU_MONTHS[en]=out;
}
/* which month holds this day, or the nearer end of the year when none does */
function luMonthOf(d,en){const ms=luMonths(en);const i=ms.findIndex(m=>m.days.some(x=>+x===+d));
  return i>=0?i:(d<ms[0].days[0]?0:ms.length-1);}

/* English kept left to right inside the right-to-left calendar: "3 weeks" would otherwise read "weeks 3" */
const en=t=>`<bdi dir="ltr">${esc(t)}</bdi>`;
const luKind=k=>k==="off"?"k-off":(k==="trip"||k==="home"||k==="event")?"k-trip":"k-zman";

function luRow(d,today,isNext,E){
  const cd=luCountdown(d.date,today);
  return `<div class="lu-row${d.date<today?" past":""}">
    <div class="lu-tile ${luKind(d.k)}">${E?`<b>${d.date.getDate()}</b><i>${LU_MON[d.date.getMonth()].toUpperCase()}</i>`:
      `<b>${ger(hNum(d.h[2]))}</b><i>${esc(hMName(d.h[1],d.h[0]))}</i>`}</div>
    <div class="lu-tx"><div class="t">${esc(luTitle(d,E))}</div>${luNote(d,E)?`<div class="n">${esc(luNote(d,E))}</div>`:``}<div class="w">${en(E?luWhenEn(d):luWhen(d))}</div></div>
    ${cd?`<div class="lu-cd${isNext?" next":""}">${en(cd)}</div>`:``}
  </div>`;
}
function luBar(z,now){
  const f=t=>luProgress(z.days[0].at,luEnd(z).at,t), done=f(now);
  return `<div class="lu-bar"><i style="width:${(done*100).toFixed(2)}%"></i>${luGaps(z).map(g=>{const a=f(g.from.at),b=f(g.to.at);
    return `<s class="${luKind(g.from.k)}${b<=done?" gone":""}" style="inset-inline-start:${(a*100).toFixed(2)}%;width:${((b-a)*100).toFixed(2)}%"></s>`;}).join("")}</div>`;
}
const luNext=(d,today,label,E)=>`<div class="lu-nx"><div class="lbl">${esc(label)}</div>${luRow(d,today,true,E)}</div>`;
function luNowCard(st,now,summer,E){
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate()), night=tonightKey(now);
  /* tonight, named the way the marking screen names it - the Hebrew date has already turned, while
     the month below rings today's daytime date */
  const nd=parseKey(night), nh=luHebOf(new Date(nd.getFullYear(),nd.getMonth(),nd.getDate()+1));
  let body="";
  if(st.type==="zman"){const z=st.z, s=z.days[0].date, e=luEnd(z).date;
    body=`<div class="big">${esc(luName(z,E))}</div>
      <div class="sub">${en("Day "+(luDays(s,today)+1)+" of "+(luDays(s,e)+1)+" · ends "+luDate(e))}</div>
      ${luBar(z,now)}${st.next?luNext(st.next,today,E?"Next":"הבא",E):``}`;
  }else if(st.type==="gap"){const g=st.gap;
    body=`<div class="big ${luKind(g.from.k)}">${esc(luGapName(g,E))}</div>
      <div class="sub">${en((g.trip?"Away · back ":"Off · seder again ")+luWhen(g.to))}</div>
      <div class="lu-bar"><i class="${luKind(g.from.k)}" style="width:${(luProgress(g.from.at,g.to.at,now)*100).toFixed(2)}%"></i></div>
      ${luNext(g.to,today,E?"Next":"הבא",E)}`;
  }else{
    body=`<div class="big">${E?"Bein hazmanim":"בין הזמנים"}</div>`;
    if(st.before){const n=luDays(today,st.before.days[0].date);
      body+=`<div class="sub">${en(n<=0?"The zman starts today":"The zman starts in "+n+" day"+(n===1?"":"s"))}</div>
        ${st.after?`<div class="lu-bar"><i class="k-bein" style="width:${(luProgress(luEnd(st.after).at,st.before.days[0].at,now)*100).toFixed(2)}%"></i></div>`:``}
        ${luNext(st.before.days[0],today,luName(st.before,E),E)}`;
    }else body+=`<div class="sub">${en(!summer&&st.after&&st.after.id==="winter"?"No summer zman this year":"The year's zmanim are over")}</div>`;
  }

}

/* One month, the way a wall calendar has it: a week to a row, Sunday first, every day tinted by
   what it is - seder, a break, a trip, or bein hazmanim left plain. A day with a line on the luach
   carries a dot in that line's colour; today is ringed in black, the day tapped in blue. */
function luMonthCard(m,i,count,today,summer,E,pick){
  const rtl=!E, lead=m.days[0].getDay();
  const heads=E?LU_DOW:["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
  let cells="";for(let k=0;k<lead;k++)cells+=`<span></span>`;
  m.days.forEach(d=>{
    const kind=luDayKind(d,summer), lines=luLinesOn(d,summer), h=luHebOf(d);
    const big=E?d.getDate():ger(hNum(h.d));
    /* the other calendar, small; on the first of its month, the month's name */
    const small=E?(h.d===1?hMNameEn(h.m,h.y):h.d):(d.getDate()===1?LU_MON[d.getMonth()]+" 1":d.getDate());
    cells+=`<button class="lu-d d-${kind}${d<today?" past":""}${+d===+today?" today":""}${pick&&+d===+pick?" pick":""}" data-a="lupick" data-k="${luKey(d)}">
      <b>${big}</b><i>${en(String(small))}</i><u class="${lines.length?luKind(lines[0].k):""}"></u></button>`;
  });
  return `<div class="lu-mc">
    <div class="lu-mh"><button class="arr" data-a="lumon" data-d="-1" ${i>0?"":"disabled"}>${rtl?"›":"‹"}</button>
      <div class="mt"><div class="t">${esc(m.title)}</div><div class="s">${en(m.sub)}</div></div>
      <button class="arr" data-a="lumon" data-d="1" ${i<count-1?"":"disabled"}>${rtl?"‹":"›"}</button></div>
    <div class="lu-grid lu-heads">${heads.map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="lu-grid">${cells}</div>
    <div class="lu-legend"><span class="d-zman">${E?"Seder":"סדר"}</span><span class="d-off">${E?"Break":"הפסקה"}</span>
      <span class="d-trip">${E?"Trip":"נסיעה"}</span><span class="d-bein">${E?"Bein hazmanim":"בין הזמנים"}</span></div>
  </div>`;
}
/* the day tapped on the month: its date both ways, what kind of day it is, and its luach lines */
function luDayCard(d,today,summer,E,next){
  const h=luHebOf(d), kind=luDayKind(d,summer), z=luZmanOn(d,summer);
  const what=kind==="zman"?luName(z,E):kind==="bein"?(E?"Bein hazmanim":"בין הזמנים"):luGapName(luGapOn(d,summer),E);
  return `<div class="lu-day">
    <div class="top"><b>${E?esc(luDate(d)):esc(ger(hNum(h.d))+" "+hMName(h.m,h.y))}</b><span>${en(E?luHebEn(h):luDate(d))}</span></div>
    <div class="what d-${kind}"><s></s>${esc(what)}${kind==="zman"?`<span>${en("day "+(luDays(z.days[0].date,d)+1)+" of "+(luDays(z.days[0].date,luEnd(z).date)+1))}</span>`:``}</div>
    ${luLinesOn(d,summer).map(x=>luRow(x,today,x===next,E)).join("")}
  </div>`;
}
/* the luach's lines that fall in the month on screen, in order */
function luMonthLines(m,today,summer,E,next){
  const lines=luYear(summer).flatMap(z=>z.days).filter(x=>m.days.some(d=>+d===+x.date));
  return `<div class="lu-ml"><div class="h">${E?"THIS MONTH":"בחודש הזה"}</div>
    ${lines.length?lines.map(x=>luRow(x,today,x===next,E)).join(""):`<div class="none">${E?"Nothing on the luach this month":"אין כלום בלוח בחודש הזה"}</div>`}</div>`;
}
const luSummerCard=(summer,E)=>`<div class="lu-sc"><div><b>${E?"Summer zman":"זמן קיץ"}</b><i>${en(summer?"On the calendar":"Switched off - no summer zman this year")}</i></div>
  <button class="sw${summer?" on":""}" data-a="summer" aria-label="Summer zman"><i></i></button></div>`;
function luZman(z,today,isCur,next,summer,E){
  const off=z.optional&&!summer, s=z.days[0], e=luEnd(z);
  let rows="";
  if(!off){const gaps=luGaps(z);
    for(let i=0;i<z.days.length;i++){const d=z.days[i], g=gaps.find(g=>g.from===d);
      if(g){rows+=`<div class="lu-gap ${luKind(g.from.k)}">${luRow(g.from,today,g.from===next,E)}
          <div class="len">${en(luLength(luDays(g.from.date,g.to.date)))}</div>${luRow(g.to,today,g.to===next,E)}</div>`;i++;}
      else rows+=luRow(d,today,d===next,E);
    }}
  const r1=E?esc(luRange(s.date,e.date)):esc(s.heb+" – "+e.heb), r2=E?esc(s.hebEn+" – "+e.hebEn):en(luRange(s.date,e.date));
  return `<div class="lu-z${isCur?" cur":""}${off?" off":""}">
    <div class="hd2"><div class="ttl"><div class="nm">${esc(luName(z,E))}${isCur?`<span class="lu-pill now">${E?"Now":"עכשיו"}</span>`:off?``:`<span class="lu-pill">${en(luLength(luDays(s.date,e.date)))}</span>`}</div>
      <div class="hr">${r1}</div><div class="gr">${r2}</div></div>
      ${z.optional?`<button class="sw${summer?" on":""}" data-a="summer" aria-label="Summer zman"><i></i></button>`:``}</div>
    ${off?`<div class="offt">${en("Switched off - no summer zman this year.")}</div>`:`<div class="rows">${rows}</div>`}
  </div>`;
}
function luBein(end,nextStart,isNow,E){
  return `<div class="lu-bein${isNow?" now":""}"><s></s><div><div class="t">${E?"Bein hazmanim":"בין הזמנים"}${isNow?`<span class="lu-pill now">${E?"Now":"עכשיו"}</span>`:``}</div>
    <div class="c">${en(nextStart?luLength(luDays(end.date,nextStart.date))+" · "+luRange(end.date,nextStart.date).replace(/, \d{4}$/,""):"from "+luDate(end.date,true))}</div></div><s></s></div>`;
}
/* The year as the luach has it: where things stand tonight, then a month at a time on a calendar,
   or as the luach's own list. In Hebrew it reads right to left and goes by Hebrew months, the
   regular date small in each day; in English it reads left to right and goes by the regular
   months, the Hebrew date small instead. */
function luachScreen(now){
  now=now||new Date();
  const E=!!state.settings.luachEnglish, asList=!!state.settings.luachList;
  const summer=summerOn(), st=luNow(now,summer), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const cur=st.type==="between"?null:st.z;
  const next=st.type==="zman"?st.next:st.type==="gap"?st.gap.to:(st.before?st.before.days[0]:null);
  let body="";
  if(!asList){
    const ms=luMonths(E);
    if(state.luMonth==null||state.luMonthEn!==E){state.luMonth=luMonthOf(today,E);state.luMonthEn=E;state.luPick=luKey(today);}
    const m=ms[state.luMonth], pick=state.luPick?parseKey(state.luPick):null;
    body=luMonthCard(m,state.luMonth,ms.length,today,summer,E,pick)+
      (pick&&m.days.some(d=>+d===+pick)?luDayCard(pick,today,summer,E,next):``)+
      luMonthLines(m,today,summer,E,next)+luSummerCard(summer,E);
  }else{
    LUACH.forEach((z,i)=>{
      body+=luZman(z,today,cur===z,next,summer,E);
      if(!z.optional||summer){
        const following=LUACH.slice(i+1).find(x=>!x.optional||summer);
        body+=luBein(luEnd(z),following?following.days[0]:null,st.type==="between"&&st.after===z,E);
      }
    });
  }
  return `<div class="hd"><div class="h1"><div><div class="htitle">Yeshiva calendar</div>
      <div class="hsub"><bdi>${E?LUACH_YEAR_EN+" school year":"שנת הלימודים "+esc(LUACH_YEAR)}</bdi></div></div>
      <button class="pill" data-a="tab" data-t="check">Done</button></div>
      <div class="lu-ctl"><div class="seg2"><button class="${asList?"":"on"}" data-a="lumode" data-v="0">${E?"Month":"חודש"}</button>
        <button class="${asList?"on":""}" data-a="lumode" data-v="1">${E?"List":"רשימה"}</button></div>
        <div class="seg2"><button class="${E?"":"on"}" data-a="lulang" data-v="0">עברית</button><button class="${E?"on":""}" data-a="lulang" data-v="1">English</button></div></div></div>
    <div class="pan lu" dir="${E?"ltr":"rtl"}">${luNowCard(st,now,summer,E)}${body}
      <div class="lu-foot">${E?"Yeshiva Gedolah Lubavitch Cincinnati":"ישיבה גדולה ליובאוויטש סינסינאטי"}</div></div>`;
}

/* ---------- live sync ---------- */
function sync(){
  const sid=state.cur;
  document.querySelectorAll("[data-mk]").forEach(b=>
    b.classList.toggle("on",statusOf(b.dataset.p,sid)===b.dataset.v));
  document.querySelectorAll("[data-slot]").forEach(el=>{
    const st=statusOf(el.dataset.slot,sid);
    el.classList.toggle("in",st==="in");
    el.classList.toggle("out",st==="out");
    el.classList.toggle("exc",st==="exc");
    el.classList.toggle("away",st==="away");
  });
  PLAN.forEach(room=>{
    const pl=document.querySelector(`[data-plan="${room.id}"]`);
    if(pl)pl.classList.toggle("allin",roomAllIn(room,sid));
    const ro=document.querySelector(`[data-rout="${room.id}"]`);
    if(ro){const o=outIn(room,sid).length;
      ro.textContent=o?o+" out":room.beds.reduce((a,b)=>a+b.slots.length,0)+" beds";
      ro.className=o?"miss":"";}
  });
  PLAN.forEach((r,i)=>{
    const b=document.querySelector(`[data-rp="${r.id}"]`); if(!b)return;
    const o=outIn(r,sid).length, ck=roomChecked(r,sid);
    b.className=(i===state.room?"on":"")+(o?" miss":ck?" done":"");
    const sp=i===state.room?null:roomSplit(r,sid);
    b.style.background=sp?sp.bg:""; b.style.borderColor=sp?sp.border:""; b.style.color=sp?sp.fg:"";
  });
  allSlots().map(s=>s.id).forEach(s=>{
    const e=document.querySelector(`[data-tb="${s}"]`); if(!e)return;
    const st=stats(s);
    if(st.out){e.textContent=st.out+" out";e.className="b out";}
    else if(!st.started){e.textContent="—";e.className="b";}
    else if(!st.left){e.textContent="all in";e.className="b done";}
    else{e.textContent=st.left+" left";e.className="b";}
  });
  const st=stats(sid), sl=document.getElementById("stat");
  if(sl){
    const bits=[st.out?`<b class="r">${st.out} out</b>`:`<b>Nobody out</b>`];
    if(st.left)bits.push(st.left+" left");
    if(st.away)bits.push(st.away+" not in town");
    if(st.exc)bits.push(st.exc+" excused");
    sl.innerHTML=label(sid)+" · "+bits.join(" · ");
  }
}

async function openCal(){
  const keys=await store.list(NPRE);
  state.calHas={}; keys.forEach(k=>state.calHas[k.slice(NPRE.length)]=1);
  const h=hebParts(state.dateKey);
  state.cal={y:h.y,m:h.m};
  drawCal();
}
function drawCal(){
  const {y,m}=state.cal, len=hML(m,y), first=hToAbs(y,m,1), lead=first%7;
  const sel=state.dateKey, tn=tonightKey(), cells=[];
  for(let i=0;i<lead;i++)cells.push(`<div class="cell empty"></div>`);
  for(let d=1;d<=len;d++){
    const abs=hToAbs(y,m,d), k=keyFromAbs(abs-1), g=parseKey(k), c=["cell"];
    if(abs%7===6)c.push("sat");
    if(state.calHas[k])c.push("has");
    if(k===tn)c.push("today");
    if(k===sel)c.push("on");
    cells.push(`<button class="${c.join(" ")}" data-a="pick" data-k="${k}">
      <span class="h">${hNum(d)}</span><span class="g">${g.getMonth()+1}/${g.getDate()}</span></button>`);
  }
  showPop(`<div class="grp">
      <div class="cnav"><button data-a="calm" data-d="-1">‹</button>
        <div class="m">${hMName(m,y)} ${ger(hNum(y%1000))}<i>${hMNameEn(m,y)} ${y}</i></div>
        <button data-a="calm" data-d="1">›</button></div>
      <div class="dow"><div>א</div><div>ב</div><div>ג</div><div>ד</div><div>ה</div><div>ו</div><div>ש</div></div>
      <div class="grid">${cells.join("")}</div>
    </div><button class="cancel" data-a="close">Cancel</button>`);
}
function showPop(h){const p=document.getElementById("pop");p.innerHTML=h;p.scrollTop=0;p.classList.add("on");document.getElementById("scrim").classList.add("on");}
function closePop(){document.getElementById("pop").classList.remove("on");document.getElementById("scrim").classList.remove("on");state.who=null;}

/* ---------- shell ---------- */
function render(){
  const y=window.scrollY;
  document.getElementById("app").innerHTML=
    state.tab==="names"?peopleScreen():state.tab==="settings"?settingsScreen():
    state.tab==="times"?timesScreen():state.tab==="missing"?missingScreen():state.tab==="luach"?luachScreen():checkScreen();
  if(state.tab==="check"&&!showingReview()){sync();if(state.mode==="one")bindSwipe();}
  window.scrollTo(0,y);
}
let tt=null;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1700);}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast("Copied");return;}catch(e){}
  const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";
  document.body.appendChild(a);a.focus();a.select();
  try{document.execCommand("copy");toast("Copied");}catch(e){toast("Couldn't copy");}
  a.remove();
}
function goRoom(i){
  if(i<0||i>=PLAN.length)return;
  state.room=i; render();
  const pw=document.getElementById("pw");
  if(pw)pw.scrollIntoView({block:"nearest"});
}
function bindSwipe(){
  const pw=document.getElementById("pw"); if(!pw)return;
  let x0=null,y0=null;
  pw.addEventListener("pointerdown",e=>{x0=e.clientX;y0=e.clientY;},{passive:true});
  pw.addEventListener("pointerup",e=>{
    if(x0===null)return;
    const dx=e.clientX-x0, dy=e.clientY-y0;
    x0=null;
    if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.6) goRoom(state.room+(dx<0?1:-1));
  },{passive:true});
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-a],[data-mk]"); if(!t)return;
  if(t.hasAttribute("data-mk")&&!t.dataset.a){ setMark(t.dataset.p,state.cur,t.dataset.v); sync(); return; }
  const a=t.dataset.a;

  if(a==="tab"){closePop();state.tab=t.dataset.t;render();window.scrollTo(0,0);return;}
  if(a==="lumode"){state.settings.luachList=t.dataset.v==="1";flush();render();return;}
  if(a==="lulang"){state.settings.luachEnglish=t.dataset.v==="1";state.luMonth=null;flush();render();return;}
  if(a==="lumon"){const n=luMonths(!!state.settings.luachEnglish).length;
    state.luMonth=Math.max(0,Math.min(n-1,state.luMonth+Number(t.dataset.d)));render();return;}
  if(a==="lupick"){state.luPick=t.dataset.k;render();return;}
  if(a==="summer"){const on=!summerOn();
    await setPerson("yeshiva",{noSummer:on?null:"1"});
    render();toast(on?"Summer zman on":"Summer zman off");return;}
  if(a==="time"){state.cur=t.dataset.s;
    document.querySelectorAll(".seg3 button").forEach(b=>b.classList.toggle("on",b.dataset.s===state.cur));
    sync(); return;}
  if(a==="jump"){
    if(state.mode==="scroll"){const el=document.getElementById("rb-"+PLAN[+t.dataset.i].id);
      if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return;}
    goRoom(+t.dataset.i);return;}
  if(a==="room"){goRoom(state.room+(+t.dataset.d));return;}
  if(a==="roomset"){const r=PLAN.find(x=>x.id===t.dataset.r)||PLAN[state.room];setRoom(r,state.cur,t.dataset.v||null);sync();return;}
  if(a==="mode"){state.mode=t.dataset.m;save();render();window.scrollTo(0,0);return;}
  if(a==="review"){state.review=true;render();window.scrollTo(0,0);return;}
  if(a==="onlyout"){state.onlyOut=t.dataset.v==="1";render();return;}
  if(a==="closenight"){
    state.night.closed=true;touch(CLOSED_KEY);state.editing=false;state.review=false;
    save();render();window.scrollTo(0,0);toast("Saved");return;}
  if(a==="day"){await flush();await loadNight(shiftDate(state.dateKey,+t.dataset.d));render();return;}
  if(a==="today"){await flush();await loadNight(tonightKey());render();return;}
  if(a==="cal"){await openCal();return;}
  if(a==="calm"){state.cal=(+t.dataset.d>0)?hNext(state.cal.y,state.cal.m):hPrev(state.cal.y,state.cal.m);drawCal();return;}
  if(a==="pick"){await flush();await loadNight(t.dataset.k);closePop();render();window.scrollTo(0,0);return;}
  if(a==="undo"){undo();return;}
  if(a==="edit"){state.editing=true;state.review=false;render();window.scrollTo(0,0);return;}
  if(a==="done"){state.editing=false;render();window.scrollTo(0,0);return;}
  if(a==="copy"){copyText(report());return;}

  if(a==="who"){openWho(t.dataset.p);return;}
  if(a==="editp"){editPerson(t.dataset.p);return;}
  if(a==="wset"){setMark(state.who,t.dataset.s,t.dataset.v);openWho(state.who);render();return;}
  if(a==="set"){if(t.disabled)return;const k=t.dataset.k;state.settings[k]=!state.settings[k];save();render();return;}
  if(a==="syncnow"){syncNow(true);return;}
  /* set up once and never touched again, so the two fields collapse to a row saying where it
     points - a form left permanently open makes a finished thing look unfinished */
  if(a==="editsync"){state.editSync=true;render();return;}
  if(a==="synced"){
    if(!state.settings.syncUrl){toast("No sync address set");return;}
    state.editSync=false;render();syncNow(true);return;}
  if(a==="more"){
    /* tucked in here rather than on the marking screen: most nights are the standing three and
       never need it, but the night that does is this night */
    showPop(`<div class="grp">
      ${showingReview()?``:`<button class="li" data-a="missing"><span class="a lnk">Who's missing</span></button>`}
      <button class="li" data-a="tab" data-t="times"><span class="a lnk">Night settings</span>
        <span class="z">${esc(allSlots().map(x=>x.label).join(" · "))}</span></button>
      <button class="li" data-a="tab" data-t="luach"><span class="a lnk">Yeshiva calendar</span></button>
      <button class="li" data-a="tab" data-t="settings"><span class="a lnk">Settings</span></button>
      </div><button class="cancel" data-a="close">Cancel</button>`);
    return;
  }
  if(a==="missing"){
    closePop(); state.missQ=""; state.missPick=[]; state.tab="missing";
    render(); window.scrollTo(0,0); return;
  }
  if(a==="misspick"){
    const pid=t.dataset.p, at=(state.missPick||[]).indexOf(pid);
    state.missPick=at<0?[...(state.missPick||[]),pid]:state.missPick.filter(x=>x!==pid);
    render(); return;
  }
  if(a==="missdone"){
    markMissing(state.missPick||[],state.cur);
    state.tab="check"; state.missQ=""; state.missPick=[];
    render(); window.scrollTo(0,0); return;
  }
  if(a==="addslot"){
    /* type="time" is the phone's own clock picker - the same one every other app gets */
    showPop(`<div class="grp"><div class="tprow"><span class="a">Add a time</span>
        <input id="tpick" type="time" value="23:30"></div>
      <button class="li" data-a="addtime"><span class="a lnk">Add</span></button>
      </div><button class="cancel" data-a="close">Cancel</button>`);
    return;
  }
  if(a==="addtime"){
    const v=(document.getElementById("tpick")||{}).value||"";
    const m=v.match(/^(\d{2}):(\d{2})$/);
    if(!m){toast("Not a time");return;}
    closePop();
    return setRounds([...allSlots().map(s=>s.id),idForClock(+m[1],+m[2])]);
  }
  if(a==="chgslot"){
    const sid=t.dataset.s, h=+sid.slice(0,2), m=sid.slice(2);
    /* the input is a 24-hour one: 12 on this app's clock is midnight, hour zero on that one */
    const h24=h===12?0:(h<6?h:h+12);
    showPop(`<div class="grp"><div class="tprow"><span class="a">Change time</span>
        <input id="tpick" type="time" value="${String(h24).padStart(2,"0")}:${m}"></div>
      <button class="li" data-a="chgtime" data-s="${sid}"><span class="a lnk">Change</span></button>
      </div><button class="cancel" data-a="close">Cancel</button>`);
    return;
  }
  if(a==="chgtime"){
    const v=(document.getElementById("tpick")||{}).value||"";
    const m=v.match(/^(\d{2}):(\d{2})$/);
    if(!m){toast("Not a time");return;}
    closePop();
    return moveRound(t.dataset.s,idForClock(+m[1],+m[2]));
  }
  if(a==="onlyslot"){return setRounds([t.dataset.s]);}
  if(a==="delslot"){return setRounds(allSlots().map(s=>s.id).filter(x=>x!==t.dataset.s));}
  if(a==="resetslots"){
    snap();
    for(const id of [...(state.night.slots||[])]){state.night.slots=state.night.slots.filter(x=>x!==id);touch(slotKey(id));}
    for(const id of [...(state.night.sheet||[])]){state.night.sheet=state.night.sheet.filter(x=>x!==id);touch(sheetKey(id));}
    if(!allSlots().some(s=>s.id===state.cur))state.cur=allSlots()[0].id;
    save();render();return;
  }
  if(a==="sheetslot"){
    const id=t.dataset.s, every=allSlots().map(s=>s.id);
    state.night.sheet=state.night.sheet||[];
    /* "all of them" is stored as nothing at all, so the first tap writes out the list it is
       turning one off from */
    if(!state.night.sheet.length)for(const x of every){state.night.sheet.push(x);touch(sheetKey(x));}
    if(state.night.sheet.includes(id))state.night.sheet=state.night.sheet.filter(x=>x!==id);
    else state.night.sheet.push(id);
    touch(sheetKey(id));
    /* everything ticked means no opinion again, so a round added later joins in */
    if(every.every(x=>state.night.sheet.includes(x))&&state.night.sheet.length===every.length)
      for(const x of every){state.night.sheet=state.night.sheet.filter(y=>y!==x);touch(sheetKey(x));}
    save();render();return;
  }
  if(a==="onlyone"){const pid=state.who;
    if(offCheck(statusOf(pid,state.cur))){toast(nameOf(pid)+" is off the check");return;}
    setRoom(roomOf(pid),state.cur,null,pid);closePop();render();return;}
  if(a==="away"){const pid=state.who, on=!isAway(pid);
    await setPerson(pid,on?{away:true,always:null}:{away:null});
    openWho(pid);render();
    toast(on?"Not in town until you turn it off":"Back in town");return;}
  if(a==="exctn"){const pid=state.who;snap();
    const i=state.night.tonight.indexOf(pid);
    if(i>=0)state.night.tonight.splice(i,1);
    else{state.night.tonight.push(pid);allSlots().forEach(({id:s})=>{if(state.night.marks[s])delete state.night.marks[s][pid];touch(markKey(s,pid));});}
    touch(excKey(pid));
    save();openWho(pid);render();return;}
  if(a==="excalways"){const pid=state.who;
    const on=!isAlways(pid);
    await setPerson(pid,on?{always:true,away:null}:{always:null});
    openWho(pid);render();
    toast(on?"Off the reports until you turn him back on":"Back on the sheet");return;}
  if(a==="unaway"){const pid=t.dataset.p;
    await setPerson(pid,{away:null});
    render();toast(nameOf(pid)+" is back in town");return;}
  if(a==="unexc"){const pid=t.dataset.p;
    await setPerson(pid,{always:null});
    render();toast(nameOf(pid)+" is back on");return;}
  if(a==="close"){closePop();return;}

  if(a==="dl"){await flush();
    const keys=await store.list(NPRE),nights={};
    for(const k of keys){const v=await store.get(k);if(v)nights[k]=v;}
    const j=JSON.stringify({v:1,saved:new Date().toISOString(),extra:state.extra,nights},null,1);
    let ok=false;
    try{const b=new Blob([j],{type:"application/json"}),u=URL.createObjectURL(b),l=document.createElement("a");
      l.href=u;l.download="room-check-"+state.dateKey+".json";document.body.appendChild(l);l.click();l.remove();
      setTimeout(()=>URL.revokeObjectURL(u),4000);ok=true;}catch(e){}
    showPop(`<div class="grp"><div class="hdd"><div class="a">Backup</div><div class="b">${ok?"Saved to your downloads":"Copy this and keep it safe"}</div></div>
      <div class="li"><textarea class="rep" id="ex" rows="8" spellcheck="false">${esc(j)}</textarea></div>
      <button class="li" data-a="copybox" data-src="ex"><span class="a lnk">Copy</span></button></div>
      <button class="cancel" data-a="close">Done</button>`);return;}
  if(a==="install"){doInstall();return;}
  if(a==="reload"){location.reload();return;}
  if(a==="checkupd"){checkUpdate();return;}
  if(a==="copybox"){const el=document.getElementById(t.dataset.src);if(el)copyText(el.value);return;}
  if(a==="imp"){showPop(`<div class="grp"><div class="hdd"><div class="a">Restore</div></div>
      <div class="li"><textarea class="rep" id="im" rows="7" placeholder="Paste a backup" spellcheck="false"></textarea></div>
      <button class="li" data-a="doimp"><span class="a lnk">Restore</span></button></div>
      <button class="cancel" data-a="close">Cancel</button>`);return;}
  if(a==="doimp"){let d;try{d=JSON.parse(document.getElementById("im").value);}catch(e){toast("Not a backup");return;}
    if(!d.nights&&!d.extra){toast("Not a backup");return;}
    state.extra=d.extra||{};
    /* a backup carries the people record too: fold it in, never overwrite, or settings changed
       since the backup was taken would be thrown away */
    if(d.nights)for(const k of Object.keys(d.nights)){
      if(k===NPRE+PEOPLE_DATE){try{people=mergeNights(people,norm(JSON.parse(d.nights[k])));}catch(e){}continue;}
      await store.set(k,d.nights[k]);}
    if(people)await store.set(NPRE+PEOPLE_DATE,JSON.stringify(people));
    await loadPeople();
    await store.set(RKEY,JSON.stringify({extra:state.extra,mode:state.mode,settings:state.settings,lastPull:state.lastPull,dirty:state.dirty}));
    await loadNight(state.dateKey);closePop();render();toast("Restored");return;}
});
document.getElementById("scrim").addEventListener("click",closePop);

document.addEventListener("input",e=>{
  const t=e.target.closest("[data-a]"); if(!t)return;
  const a=t.dataset.a, pid=state.who;
  /* the sync fields belong to no person, so they are handled before the person guard below */
  if(a==="syncurl"){state.settings.syncUrl=t.value.trim();save();startPolling();return;}
  if(a==="synctok"){state.settings.syncToken=t.value.trim();save();return;}

/* ---------- password gate ---------- */
/* Not a security boundary — the page is public and anyone reading the source
   can step around this. It keeps the app out of search results and stops
   people wandering in. To change it, put the sha256 of the new password here. */
const PASS_HASH="b1e9437aa6f093d641b3f33ef5a823e4109a27a449a9029fc9ad7a9fb8beb45a";
const GKEY="roomcheck-unlocked";
const hex=b=>[...new Uint8Array(b)].map(n=>n.toString(16).padStart(2,"0")).join("");
const hashOf=async s=>hex(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)));
const knownDevice=()=>{try{return localStorage.getItem(GKEY)===PASS_HASH;}catch(e){return false;}};
function gate(){
  document.getElementById("app").innerHTML=`<div class="gate"><div class="gbox">
      <div class="gt">Room Check</div>
      <input type="password" id="gp" placeholder="Password" autocomplete="current-password"
        inputmode="numeric" pattern="[0-9]*" enterkeyhint="go">
      <div class="gerr" id="ge"></div>
      <button class="btn" id="gb">Unlock</button>
    </div></div>`;
  const inp=document.getElementById("gp"), err=document.getElementById("ge");
  const go=async()=>{
    let h;
    try{h=await hashOf(inp.value);}catch(e){err.textContent="Open this over https to unlock";return;}
    if(h!==PASS_HASH){err.textContent="Wrong password";inp.value="";inp.focus();return;}
    try{localStorage.setItem(GKEY,PASS_HASH);}catch(e){}
    boot();
  };
  document.getElementById("gb").addEventListener("click",go);
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  inp.addEventListener("input",()=>{err.textContent="";});
  inp.focus();
}

/* ---------- boot ---------- */
/* A browser from before people synced has them only in its own list: start the shared record from
   that, dated as old as can be, so anything set anywhere since wins over it. */
async function loadPeople(){
  const raw=await store.get(NPRE+PEOPLE_DATE); let n=null;
  if(raw){try{n=norm(JSON.parse(raw));}catch(e){}}
  const seed=peopleNight(state.extra,1);
  const merged=mergeNights(n,seed);
  if(!n||JSON.stringify(mergeNights(n,null))!==JSON.stringify(merged)){
    await store.set(NPRE+PEOPLE_DATE,JSON.stringify(merged));
    if(!state.dirty.includes(PEOPLE_DATE))state.dirty.push(PEOPLE_DATE);
  }
  people=merged; state.extra=extraFrom(people);
}
const SYNC_URL="https://room-check-sync.yechezkelbinstok.workers.dev",
  SYNC_TOKEN="6iciRn6C1NAU8xOGfHS99ZrCO2wtqjyfNQ-_Lr-jJDg";
async function boot(){
  if(!window.storage)state.ok=false;
  state.persist=!!(window.storage||LS);
  let raw=await store.get(RKEY);
  if(!raw){const m=await store.get(MKEY);
    if(m){try{const d=JSON.parse(m);if(d.extra)raw=JSON.stringify({extra:d.extra});}catch(e){}}}
  if(raw){try{const d=JSON.parse(raw);state.extra=d.extra||{};if(d.mode)state.mode=d.mode;
    if(d.settings)state.settings={...state.settings,...d.settings};
    state.lastPull=d.lastPull||0; state.dirty=Array.isArray(d.dirty)?d.dirty:[];}catch(e){state.extra={};}}
  /* this yeshiva's own server, wherever none has been entered, so a new browser syncs from the
     first open - the same one the app has built in and server/README.md writes down */
  if(!state.settings.syncUrl){state.settings.syncUrl=SYNC_URL;
    if(!state.settings.syncToken)state.settings.syncToken=SYNC_TOKEN;}
  await loadPeople();
  await loadNight(tonightKey());
  /* whichever configured round is nearest behind the clock - reading the rounds rather than the
     original three, or deleting 11:15 would leave this opening on a round that no longer exists */
  const d=new Date(), every=allSlots(), now=slotOrder(idForClock(d.getHours(),d.getMinutes()));
  const past=every.filter(s=>slotOrder(s.id)<=now);
  state.cur=(past.length?past[past.length-1]:every[0]).id;
  render(); flush();
  /* a check written on the phone an hour ago should be here on open, unasked */
  syncNow(false);
  startPolling();
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible"){syncNow(false);startPolling();}else stopPolling();});
}
/* Two people marking at once should see each other, so pull while the sheet is actually being
   looked at - but only then. A tab in the background gets nothing, which is what keeps this free:
   an empty pull is a few dozen bytes, and a check lasts a quarter of an hour. */
let pollT=null;
function startPolling(){
  stopPolling();
  if(!state.settings.syncUrl)return;
  pollT=setInterval(()=>{
    if(document.visibilityState!=="visible"||!state.settings.syncUrl)return stopPolling();
    syncNow(false);
  },30000);
}
function stopPolling(){if(pollT){clearInterval(pollT);pollT=null;}}
knownDevice()?boot():gate();
