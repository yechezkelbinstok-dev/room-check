# The iPhone app's Xcode project, written down rather than committed: GitHub's Mac turns this into
# RoomCheck.xcodeproj with XcodeGen on every build (.github/workflows/ios.yml), so there is no
# generated project file to keep in step by hand.
name: RoomCheck
options:
  bundleIdPrefix: com.roomcheck
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  RoomCheckCore:
    path: RoomCheckCore
targets:
  RoomCheck:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: RoomCheckCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roomcheck.app
        PRODUCT_NAME: RoomCheck
        # the build passes the Android app's version in, so the two always say the same number
        MARKETING_VERSION: "1.16.2"
        CURRENT_PROJECT_VERSION: "46"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Room Check
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: NO
  # only for the screenshots that need a finger on the screen (ci/screenshots.sh); never in the app
  RoomCheckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: RoomCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roomcheck.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RoomCheck
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
schemes:
  RoomCheck:
    build:
      targets:
        RoomCheck: all
        RoomCheckUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RoomCheckUITests
    archive:
      config: Release
